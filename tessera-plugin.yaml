# Weather warnings of the DWD and NINA from Home Assistant: a tile with the strongest warning, coloured by its level,
# and a card with every warning and its text. Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: weather_warnings
version: 1.1.2
# 0.9: Tone::GOOD, ui::set_fill and one-line labels; 0.10: ui::text for the descriptions.
api: "0.10"
icon: alert-circle
maintainer: hflocki
license: MIT
stage: beta
topics: [weather]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

permissions:
  # The screen reads the chosen entities and their attributes itself.
  read_entities: ["{dwd}", "{dwd_advance}", "{nina_1}", "{nina_2}"]

inputs:
  # The DWD Weather Warnings sensors of a region and two NINA warning slots. Any may stay empty.
  - { id: dwd, kind: entity, domains: [sensor], scope: screen, label: input_dwd, hint: input_dwd_hint }
  - { id: dwd_advance, kind: entity, domains: [sensor], scope: screen, label: input_dwd_advance,
      hint: input_dwd_advance_hint }
  - { id: nina_1, kind: entity, domains: [binary_sensor], scope: screen, label: input_nina_1, hint: input_nina_hint }
  - { id: nina_2, kind: entity, domains: [binary_sensor], scope: screen, label: input_nina_2 }

tiles:
  - id: status
    name: tile_name
    icon: alert-circle
    sizes: { min: 1x1, max: 3x2 }
    # A tint, a circle, an icon and two labels.
    memory: 700
    example: tile_example
    options:
      - { id: advance, kind: toggle, default: true, label: advance, hint: advance_hint }

cards:
  # A tap on the tile: every warning with its time, source and text, over the whole width.
  - { id: warnings, name: card_name, wide: true }
