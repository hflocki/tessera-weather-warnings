# What tools/preview.py shows (docs/PREVIEW.md). The bench builds with plugin.yaml's defaults, so the DWD sensors read
# sensor.warnings_not_chosen here; made-up warnings. The map is a drawn stand-in for the DWD's, never fetched.
tiles:
  - tile: status
    name: Warnings
    options: { map: nrw }
    sizes: [2x2, 1x1, 2x1, 4x3]

cards:
  - { card: warnings }

states:
  sensor.warnings_not_chosen:
    state: "2"
    attributes:
      warning_count: 2
      warning_1_name: DAUERREGEN
      warning_1_headline: Amtliche WARNUNG vor DAUERREGEN
      warning_1_description: Nach bisher beobachteten Niederschlagsmengen von 10 bis 20 l/m² tritt Dauerregen mit Unterbrechungen auf. Dabei werden nochmals Niederschlagsmengen zwischen 50 l/m² und 60 l/m² erwartet.
      warning_1_level: 2
      warning_1_start: "{now-2h}"
      warning_1_end: "{now+26h}"
      warning_2_name: STURMBÖEN
      warning_2_headline: Amtliche WARNUNG vor STURMBÖEN
      warning_2_description: Es treten Sturmböen mit Geschwindigkeiten um 75 km/h (21 m/s, 41 kn, Bft 9) aus südwestlicher Richtung auf.
      warning_2_level: 2
      warning_2_start: "{now-1h}"
      warning_2_end: "{now+4h}"

pictures:
  "https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnungen_gemeinde_map_nrw.png": preview/map.png
